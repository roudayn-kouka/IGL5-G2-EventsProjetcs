# =============================================================================
#  Configuration de l'usine DevOps (EC2 créée par Terraform)
#  ansible-playbook site.yml --ask-vault-pass
# =============================================================================
- name: Usine DevOps · Jenkins, Nexus, SonarQube
  hosts: devops
  become: true
  roles:
    - common        # paquets, fuseau horaire, réglages noyau SonarQube
    - docker        # Docker Engine + Compose
    - devops_stack  # Caddy (HTTPS) + Jenkins (JCasC) + Nexus + SonarQube/PostgreSQL
    - nexus_config  # mot de passe admin, désactivation de l'accès anonyme
