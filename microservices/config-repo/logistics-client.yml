server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  retry:
    instances:
      logisticsService:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      logisticsService:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
  circuitbreaker:
    instances:
      logisticsService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      logisticsService:
        timeout-duration: 5s
