name: events-local-ci
services:
  agent:
    image: events-jenkins-agent:jdk17-maven3.9.11
    build:
      context: .
    container_name: events-jenkins-agent
    hostname: events-jenkins-agent
    restart: unless-stopped
    init: true
    environment:
      # Public key only. Private key belongs in Jenkins SSH credentials.
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY:-}
    volumes:
      - agent-work:/home/jenkins/agent
      - maven-cache:/home/jenkins/.m2
      - ssh-config:/etc/ssh
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-work:/var/lib/docker/volumes/events-ci-agent-work/_data
    networks:
      - jenkins
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/sshd.pid && kill -0 $$(cat /var/run/sshd.pid)"]
      interval: 15s
      timeout: 5s
      retries: 4
    group_add:
      - "0"

  argocd-tunnel:
    image: events-argocd-tunnel:demo
    build:
      context: ../../platform/scripts/argocd-tunnel
    container_name: events-argocd-tunnel
    hostname: events-argocd-tunnel
    restart: unless-stopped
    init: true
    depends_on:
      agent:
        condition: service_started
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      EKS_CLUSTER_NAME: ${EKS_CLUSTER_NAME:-fst-events}
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      # This is a dedicated [default] Academy profile outside the repository.
      # No credential is baked into the image or copied into a Docker volume.
      - type: bind
        source: ${ARGOCD_TUNNEL_CREDENTIALS_DIR:-./.argocd-tunnel-credentials-not-configured}/credentials
        target: /aws/credentials
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /work:uid=1000,gid=1000,mode=0700
    networks:
      - jenkins
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8080/api/version >/dev/null"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s

networks:
  jenkins:
    external: true
    name: jenkins-net
volumes:
  agent-work:
    name: events-ci-agent-work
  maven-cache:
    name: events-ci-maven-cache
  ssh-config:
    name: events-ci-agent-ssh-config
