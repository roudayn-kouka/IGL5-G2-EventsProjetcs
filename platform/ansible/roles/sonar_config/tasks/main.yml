- name: Attendre que SonarQube réponde
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/system/status"
    method: GET
    return_content: true
    status_code: 200
  register: sonar_config_health
  retries: 60
  delay: 10
  # /api/system/health exige une authentification : status est public
  until: (sonar_config_health.json | default({})).get('status', '') == 'UP'

- name: Vérifier si le mot de passe administrateur Vault est déjà actif
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/authentication/validate"
    method: GET
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: sonar_config_vault_auth
  failed_when: false
  no_log: true

- name: Vérifier le mot de passe initial admin/admin
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/authentication/validate"
    method: GET
    url_username: admin
    url_password: admin
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: sonar_config_initial_auth
  failed_when: false
  when: not (sonar_config_vault_auth.json.valid | default(false) | bool)
  no_log: true

- name: Vérifier que le mot de passe administrateur est connu
  ansible.builtin.assert:
    that:
      - (sonar_config_vault_auth.json.valid | default(false) | bool) or
        (sonar_config_initial_auth.json.valid | default(false) | bool)
    fail_msg: >-
      SonarQube ne valide ni le mot de passe Vault ni admin/admin.
      Corrige vault_sonar_admin_password avant de poursuivre.

- name: Remplacer le mot de passe initial de SonarQube
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/users/change_password"
    method: POST
    url_username: admin
    url_password: admin
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      login: admin
      previousPassword: admin
      password: "{{ sonar_admin_password }}"
    status_code: 204
  when:
    - not (sonar_config_vault_auth.json.valid | default(false) | bool)
    - sonar_config_initial_auth.json.valid | default(false) | bool
  no_log: true

- name: Vérifier l'authentification administrateur après configuration
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/authentication/validate"
    method: GET
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: sonar_config_admin_auth
  no_log: true

- name: Vérifier l'authentification SonarQube
  ansible.builtin.assert:
    that:
      - sonar_config_admin_auth.json.valid | bool
    fail_msg: "L'authentification administrateur SonarQube échoue après configuration."

- name: Lister les webhooks SonarQube
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/webhooks/list"
    method: GET
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: sonar_config_webhooks
  no_log: true

- name: Retrouver le webhook Jenkins existant
  ansible.builtin.set_fact:
    sonar_config_jenkins_webhook: >-
      {{ (sonar_config_webhooks.json.webhooks | selectattr('name', 'equalto', 'jenkins') | list | first)
         | default({}) }}

- name: Créer le webhook SonarQube vers Jenkins
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/webhooks/create"
    method: POST
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      name: jenkins
      url: "{{ sonar_webhook_url }}"
    status_code: 200
  when: sonar_config_jenkins_webhook | length == 0
  no_log: true

- name: Mettre à jour l'URL du webhook SonarQube s'il existe déjà
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/webhooks/update"
    method: POST
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      key: "{{ sonar_config_jenkins_webhook.key }}"
      name: jenkins
      url: "{{ sonar_webhook_url }}"
    status_code: 200
  when:
    - sonar_config_jenkins_webhook | length > 0
    - sonar_config_jenkins_webhook.url != sonar_webhook_url
  no_log: true

- name: Lister les jetons SonarQube
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/user_tokens/search"
    method: GET
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: sonar_config_tokens
  no_log: true

- name: Déterminer si le jeton Jenkins existe déjà
  ansible.builtin.set_fact:
    sonar_config_jenkins_token_exists: >-
      {{ (sonar_config_tokens.json.userTokens | selectattr('name', 'equalto', 'jenkins') | list | length) > 0 }}

# Nouveau jeton si le Vault n'en a pas, ou si SonarQube ne connaît plus le jeton « jenkins ».
# Un jeton existant mais absent du Vault est orphelin (valeur illisible, inutilisée par Jenkins) :
# il est révoqué puis remplacé. Le jeton va directement dans le Vault, sans jamais être affiché.
- name: Déterminer si un nouveau jeton Jenkins est nécessaire
  ansible.builtin.set_fact:
    sonar_config_new_token: "{{ (sonar_token | length == 0) or not (sonar_config_jenkins_token_exists | bool) }}"

- name: Fichier de mot de passe Vault sur le contrôleur (enregistrement du jeton)
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.vault_pass"
  delegate_to: localhost
  become: false
  register: sonar_config_vault_pass
  when: sonar_config_new_token | bool

- name: Refuser de générer un jeton qui ne pourrait pas être enregistré
  ansible.builtin.fail:
    msg: >-
      Un jeton SonarQube doit être créé, mais {{ playbook_dir }}/.vault_pass est absent :
      sans lui, le jeton (affichable une seule fois) serait perdu. Créer ce fichier (0600) et relancer.
  when:
    - sonar_config_new_token | bool
    - not sonar_config_vault_pass.stat.exists

- name: Révoquer le jeton jenkins orphelin (absent du Vault)
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/user_tokens/revoke"
    method: POST
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      name: jenkins
    status_code: 204
  when:
    - sonar_config_new_token | bool
    - sonar_config_jenkins_token_exists | bool
  no_log: true

- name: Générer le jeton d'analyse Jenkins
  ansible.builtin.uri:
    url: "{{ sonarqube_api_url }}/api/user_tokens/generate"
    method: POST
    url_username: admin
    url_password: "{{ sonar_admin_password }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      name: jenkins
    return_content: true
    status_code: 200
  register: sonar_config_generated_token
  when: sonar_config_new_token | bool
  no_log: true

- name: Enregistrer le jeton dans vault_sonar_token (contrôleur, valeur non affichée)
  ansible.builtin.command:
    cmd: bash {{ playbook_dir }}/../scripts/vault-set.sh vault_sonar_token
    stdin: "{{ sonar_config_generated_token.json.token }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when: sonar_config_new_token | bool
  no_log: true

- name: Utiliser le nouveau jeton pour la suite du playbook
  ansible.builtin.set_fact:
    sonar_token: "{{ sonar_config_generated_token.json.token }}"
  when: sonar_config_new_token | bool
  no_log: true

# devops_stack a déjà écrit .env : on le réécrit avec le jeton, puis Compose recrée Jenkins
# (environnement modifié) et JCasC recharge le credential sonar-token.
- name: Transmettre le jeton à Jenkins (.env de la stack)
  ansible.builtin.template:
    src: "{{ role_path }}/../devops_stack/templates/env.j2"
    dest: "{{ stack_dir }}/.env"
    mode: "0600"
  when: sonar_config_new_token | bool
  no_log: true

- name: Recréer Jenkins avec le nouveau credential sonar-token
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    services: [jenkins]
    state: present
  when: sonar_config_new_token | bool
