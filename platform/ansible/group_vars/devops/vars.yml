# Configuration de l'usine DevOps
stack_dir: /opt/fst-devops
base_domain: "{{ devops_public_ip }}.sslip.io"     # jenkins.<ip>.sslip.io, sonar..., nexus...
timezone: Africa/Tunis

# Profil mémoire réduite (ex. t3.large AWS Academy, 8 Go) : activé automatiquement sous
# 12 000 Mo de RAM. Forçable : -e low_memory_profile=true|false. Au-delà, valeurs inchangées.
low_memory_threshold_mb: 12000
low_memory_profile: "{{ ansible_memtotal_mb | int < low_memory_threshold_mb | int }}"
swap_file_path: /swapfile
swap_file_size_mb: 8192
jenkins_java_heap: "{{ '1g' if low_memory_profile | bool else '2g' }}"
jenkins_num_executors: "{{ 1 if low_memory_profile | bool else 2 }}"
nexus_jvm_params: >-
  {{ '-Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g' if low_memory_profile | bool
     else '-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g' }}

# Dépôts GitHub
github_owner: roudayn-kouka
app_repo: IGL5-G2-EventsProjetcs
platform_repo: roudayn-kouka/IGL5-G2-EventsProjetcs
gitops_branch: gitops

# Points d'accès utilisés par le pipeline (variables globales Jenkins)
nexus_internal_url: http://nexus:8081
# argocd_server et apps_domain : écrits par `make post-apply` dans runtime.yml (ignoré par Git).
# Ne pas les définir ici : vars.yml est lu après runtime.yml (ordre alphabétique) et les écraserait.
sonarqube_internal_url: http://sonarqube:9000
sonar_webhook_url: http://jenkins:8080/sonarqube-webhook/
github_webhook_url: "https://jenkins.{{ base_domain }}/github-webhook/"

# Secrets : définis dans vault.yml (chiffré avec ansible-vault)
jenkins_admin_password: "{{ vault_jenkins_admin_password }}"
nexus_admin_password: "{{ vault_nexus_admin_password }}"
sonar_db_password: "{{ vault_sonar_db_password }}"
sonar_admin_password: "{{ vault_sonar_admin_password }}"
github_user: "{{ vault_github_user }}"
github_token: "{{ vault_github_token }}"
argocd_token: "{{ vault_argocd_token | default('') }}"
sonar_token: "{{ vault_sonar_token | default('') }}"
slack_bot_token: "{{ vault_slack_bot_token | default('') }}"
