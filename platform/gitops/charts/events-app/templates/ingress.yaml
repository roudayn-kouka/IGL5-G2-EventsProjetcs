{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: events-app
  labels:
    {{- include "events.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.app.contextPath }}
            pathType: Prefix
            backend:
              service:
                name: events-app
                port:
                  name: http
{{- end }}
