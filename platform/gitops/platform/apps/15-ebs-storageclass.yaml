apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-storageclass
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/roudayn-kouka/IGL5-G2-EventsProjetcs.git
    targetRevision: main
    path: platform/gitops/platform/storage-class
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
