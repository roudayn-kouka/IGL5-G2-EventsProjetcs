# Règles d'alerte Events + dashboard Grafana « Events FST · par feature »
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/roudayn-kouka/IGL5-G2-Events-Platform.git
    targetRevision: main
    path: gitops/platform/monitoring-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
