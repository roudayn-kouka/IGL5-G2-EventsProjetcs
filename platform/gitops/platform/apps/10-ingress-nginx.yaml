# Point d'entrée HTTP du cluster : un Network Load Balancer AWS pour toutes les features
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.14.5
    helm:
      valuesObject:
        controller:
          service:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }   # attend les CRD du monitoring
