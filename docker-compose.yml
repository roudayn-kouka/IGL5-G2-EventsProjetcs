services:
  db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copiez .env.example vers .env et définissez MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eventsdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: events-app
    ports:
      - "9090:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/eventsdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copiez .env.example vers .env et définissez MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    restart: on-failure

volumes:
  mysql_data:
