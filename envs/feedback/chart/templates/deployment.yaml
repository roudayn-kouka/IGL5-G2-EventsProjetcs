apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-app
  labels:
    {{- include "events.labels" . | nindent 4 }}
    {{- include "events.appSelector" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "events.appSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "events.labels" . | nindent 8 }}
        {{- include "events.appSelector" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo 'attente MySQL...'; sleep 3; done"]
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: events-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/{{ .Values.mysql.database }}?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: events-db, key: password }
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: APP_DEMODATA
              value: {{ .Values.app.demoData | quote }}
            - name: FEATURE
              value: {{ .Values.feature | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.app.javaOpts | quote }}
          startupProbe:
            httpGet: { path: "{{ .Values.app.contextPath }}/actuator/health/liveness", port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: "{{ .Values.app.contextPath }}/actuator/health/liveness", port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: "{{ .Values.app.contextPath }}/actuator/health/readiness", port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
