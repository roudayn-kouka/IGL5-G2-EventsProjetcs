{{- /* Mot de passe MySQL généré une seule fois puis conservé (lookup) : pas de secret dans Git */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "events-db" -}}
{{- $password := randAlphaNum 24 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "password" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: events-db
  labels:
    {{- include "events.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password }}
